# Cucumber Runner Configuration

# Feature file locations
cucumber.features=src/test/resources/features

# Step definition package
cucumber.glue=com.lms.steps,com.lms.hooks

# Pretty output
cucumber.publish.quiet=false

# Plugin configuration (JSON for reporting)
cucumber.plugin=json:target/cucumber.json,html:target/cucumber-reports/index.html

# Monochrome output (for CI/CD)
cucumber.monochrome=false

# Parallel execution (optional)
# cucumber.execution.parallel.enabled=false
# cucumber.execution.parallel.threads=1
